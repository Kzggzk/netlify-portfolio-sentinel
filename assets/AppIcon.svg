<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0DAB9C"/>
      <stop offset="1" stop-color="#0D2B63"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Smaller, well-padded macOS-style squircle (10% canvas margin). -->
  <rect x="102.4" y="102.4" width="819.2" height="819.2" rx="183.3" ry="183.3" fill="url(#bg)"/>
  <rect x="102.4" y="512" width="819.2" height="409.6" fill="url(#sheen)"/>
