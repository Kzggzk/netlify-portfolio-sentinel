  <text x="512" y="446.5" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, Helvetica Neue, Arial, sans-serif"
        font-weight="800" font-size="311" fill="#FFFFFF" fill-opacity="0.97">NF</text>
  <!-- Subtle uptrend accent. -->
  <polyline points="348.2,725 462.8,667.7 561.2,708.6 675.8,618.5"
            fill="none" stroke="#D4FA73" stroke-opacity="0.95"
